- aid: telefonica:scam-signal-api
  name: Telefónica Scam Signal API
  description: >-
    The Scam Signal API enables companies to protect their customers from phishing scams and voice fraud
    by detecting active scam calls in real time using Telefónica's network intelligence. Available in
    Spain.
  humanURL: https://opengateway.telefonica.com/en/apis/scam-signal
