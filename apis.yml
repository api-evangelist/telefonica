    url: https://opengateway.telefonica.com/en/apis/age-verification
- aid: telefonica:line-tenure-api
  name: Telefónica Line Tenure API
  description: >-
    The Line Tenure API indicates how long a mobile number has belonged to its current user, providing
    a fraud risk signal for identity validation and account security workflows. Available in Spain, Brazil,
    and the United Kingdom.
  humanURL: https://opengateway.telefonica.com/en/apis/line-tenure
  baseURL: https://opengateway.telefonica.com
  tags:
  - Fraud Prevention
  - Identity Verification
  - Financial Services
  - Mobile Security
  properties:
  - type: Documentation
    url: https://opengateway.telefonica.com/en/apis/line-tenure
- aid: telefonica:population-density-data-api
  name: Telefónica Population Density Data API
  description: >-
    The Population Density Data API provides dynamic real-time data on population density in a specific
    geographic area and time window, derived from anonymized and aggregated mobile network data. Used
    for transport planning, event management, and retail analytics. Available in Spain.
  humanURL: https://opengateway.telefonica.com/en/apis/population-density-data
  baseURL: https://opengateway.telefonica.com
