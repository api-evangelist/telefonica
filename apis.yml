- aid: telefonica:age-verification-api
  name: Telefónica Age Verification API
  description: >-
    The Age Verification API allows companies to confirm in real time whether a mobile user meets a specified
    age threshold, using carrier data for privacy-preserving age checks without sharing personal data.
    Available in the United Kingdom.
  humanURL: https://opengateway.telefonica.com/en/apis/age-verification
  baseURL: https://opengateway.telefonica.com
  tags:
